[book]
title = "Quent Tutorial"
description = "A step-by-step tutorial for authoring Quent models in YAML."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
theme = "theme"
additional-css = ["tutorial.css"]
additional-js = ["language-tabs.js", "quiz.js"]
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.playground]
runnable = false
