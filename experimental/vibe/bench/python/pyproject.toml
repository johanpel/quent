[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "quent-bench"
version = "0.0.0"
requires-python = ">=3.11"

[tool.maturin]
manifest-path = "bridge/Cargo.toml"
module-name = "quent_bench"
include = [
  { path = "quent_bench/__init__.pyi", from = "out-dir", to = "" },
  { path = "quent_bench/py.typed", from = "out-dir", to = "" },
]
