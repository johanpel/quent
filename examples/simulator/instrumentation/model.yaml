quent: alpha
model: Simulator
doc: Query-engine simulator event model.

records:
  EngineImplementationAttributes:
    doc: Details about the simulated query engine implementation.
    fields:
      name: { option: string }
      version: { option: string }
      custom_attributes: dynamic

  Edge:
    doc: A directed edge between two operator ports.
    fields:
      source: { ref: Port }
      target: { ref: Port }

  PlanParent:
    doc: The query owning a plan and its optional predecessor plan.
    fields:
      query_id: { scope-ref: Query }
      plan_id: { option: { ref: Plan } }

entities:
  Engine:
    doc: The simulated query engine and root of the reference tree.
    events:
      init:
        attributes:
          implementation: EngineImplementationAttributes
          instance_name: { option: string }
      exit: {}

  QueryGroup:
    doc: A group of queries submitted to an engine.
    events:
      declaration:
        attributes:
          instance_name: string
          engine_id: { scope-ref: Engine }

  Worker:
    doc: A worker executing plans for an engine.
    events:
      init:
        attributes:
          parent_engine_id: { scope-ref: Engine }
          instance_name: string
      exit: {}

  Plan:
    doc: A directed acyclic graph of query operators.
    events:
      declaration:
        attributes:
          parent: PlanParent
          instance_name: string
          edges: { list: Edge }
          worker_id: { option: { ref: Worker } }

  Operator:
    doc: A source, sink, or transformation within a plan.
    events:
      declaration:
        attributes:
          plan_id: { scope-ref: Plan }
          parent_operator_ids: { list: { ref: Operator } }
          instance_name: string
          type_name: string
          custom_attributes: dynamic
      statistics:
        attributes:
          custom_attributes: dynamic

  Port:
    doc: An input or output of an operator.
    events:
      declaration:
        attributes:
          operator_id: { scope-ref: Operator }
          instance_name: string
      statistics:
        attributes:
          custom_attributes: dynamic

  ThreadPool:
    doc: The processors available to a worker.
    events:
      declaration:
        attributes:
          instance_name: string
          worker_id: { scope-ref: Worker }

  Network:
    doc: The network connecting an engine's workers.
    events:
      declaration:
        attributes:
          instance_name: string
          engine_id: { scope-ref: Engine }

fsms:
  Query:
    doc: A query progressing through planning and execution.
    states:
      init:
        initial: true
        attributes:
          instance_name: string
          query_group_id: { scope-ref: QueryGroup }
        to: [planning]
      planning:
        to: [executing]
      executing:
        to: [exit]
      exit: {}

  Memory:
    doc: Worker memory with a fixed occupancy bound.
    resource:
      bytes: { kind: occupancy, known-bounds: true }
    states:
      initializing:
        initial: true
        attributes:
          instance_name: string
          worker_id: { scope-ref: Worker }
        to: [operating]
      operating:
        attributes:
          limits: { sets-resource-bounds: true }
        to: [finalizing]
      finalizing:
        to: [exit]
      exit: {}

  Processor:
    doc: A unit-capacity processor belonging to a thread pool.
    resource: true
    states:
      initializing:
        initial: true
        attributes:
          instance_name: string
          thread_pool_id: { scope-ref: ThreadPool }
        to: [operating]
      operating:
        to: [finalizing]
      finalizing:
        to: [exit]
      exit: {}

  # Storage and network channels are separate types because every entity in a
  # reference tree has exactly one parent entity type.
  StorageChannel:
    doc: A worker-local channel transferring bytes between storage resources.
    resource:
      bytes: { kind: rate, known-bounds: true }
    states:
      initializing:
        initial: true
        attributes:
          instance_name: string
          worker_id: { scope-ref: Worker }
          source_id: { ref: Memory }
          target_id: { ref: Memory }
        to: [operating]
      operating:
        attributes:
          limits: { sets-resource-bounds: true }
        to: [finalizing]
      finalizing:
        to: [exit]
      exit: {}

  NetworkChannel:
    doc: An engine-network channel transferring bytes between workers.
    resource:
      bytes: { kind: rate, known-bounds: true }
    states:
      initializing:
        initial: true
        attributes:
          instance_name: string
          network_id: { scope-ref: Network }
          source_id: { ref: Memory }
          target_id: { ref: Memory }
        to: [operating]
      operating:
        attributes:
          limits: { sets-resource-bounds: true }
        to: [finalizing]
      finalizing:
        to: [exit]
      exit: {}

  Task:
    doc: A unit of work executed for an operator.
    states:
      queueing:
        initial: true
        attributes:
          operator_id: { scope-ref: Operator }
        to: [allocating]
      allocating:
        attributes:
          use_thread: { uses: Processor }
        to: [computing, loading]
      loading:
        attributes:
          use_thread: { uses: Processor }
          use_fs_to_mem: { uses: StorageChannel }
          use_memory: { uses: Memory }
        to: [computing]
      computing:
        attributes:
          input_bytes: u64
          use_thread: { uses: Processor }
          use_memory: { uses: Memory }
        to: [sending, spilling, exit]
      spilling:
        attributes:
          use_thread: { uses: Processor }
          use_mem_to_fs: { uses: StorageChannel }
        to: [allocating]
      sending:
        attributes:
          use_thread: { uses: Processor }
          use_link: { uses: NetworkChannel }
        to: [queueing]
      exit: {}
