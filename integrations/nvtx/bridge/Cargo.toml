[package]
name = "nvtx-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The bridge is a single adapter type. It needs the NVTX event vocabulary, the
# Quent `EventPayload` trait it implements, and serde for the transparent derive.
nvtx-events = { path = "../events" }
nvtx-injection = { path = "../injection" }
nvtx-sys = { workspace = true }
quent-events = { path = "../../../crates/events" }
serde = { workspace = true }
