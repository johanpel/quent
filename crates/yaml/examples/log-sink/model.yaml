quent: alpha
model: logging_sink

entities:
  AppLog:
    doc: Application logging sink.
    log:
      attributes:
        target: { option: string }
        file: { option: string }
        line: { option: u32 }
        module: { option: string }
        thread_name: { option: string }
      levels:
        - name: trace
        - name: debug
        - name: info
          doc: Informational messages.
        - name: warning
          attributes:
            category: { option: string }
        - name: error
          attributes:
            error_code: { option: u32 }
