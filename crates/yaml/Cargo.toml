[package]
name = "quent-yaml"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
convert_case = "0.8"
quent-constraints = { path = "../constraints" }
quent-schema = { path = "../schema" }
# Pinned exactly: the tree builder relies on parser-level details (spanned
# events, scalar styles, anchor ids) of a pre-1.0 crate.
saphyr-parser = "=0.0.9"
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
quent-schema = { path = "../schema", features = ["test-utils"] }

[[bin]]
name = "quent-yaml-check"
path = "src/bin/check.rs"
