[package]
name = "quent-yaml"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
convert_case = "0.8"
indexmap = { workspace = true, features = ["serde"] }
quent-constraints = { path = "../constraints" }
quent-schema = { path = "../schema" }
serde = { workspace = true }
serde_json = { workspace = true }
# serde_yaml is archived; serde_norway is its maintained fork.
serde_norway = "0.9"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
quent-schema = { path = "../schema", features = ["test-utils"] }

[[bin]]
name = "quent-yaml-check"
path = "src/bin/check.rs"
