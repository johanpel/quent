[package]
name = "quent-yaml"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
convert_case = "0.8"
indexmap = { workspace = true, features = ["serde"] }
quent-constraints = { path = "../constraints" }
quent-schema = { path = "../schema" }
serde = { workspace = true }
serde_json = { workspace = true }
# Deserialize directly from YAML 1.2 through saphyr (the maintained lineage),
# so 1.1 keyword names like `on` stay strings and errors carry a location.
serde-saphyr = "0.0.29"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
quent-schema = { path = "../schema", features = ["test-utils"] }

[[bin]]
name = "quent-yaml-check"
path = "src/bin/check.rs"
