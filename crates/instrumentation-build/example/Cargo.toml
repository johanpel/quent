[package]
name = "quent-instrumentation-build-example"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The single required dep: everything the generated code references comes from
# here. `quent-exporter` is the one exception, for selecting exporter features.
quent-instrumentation = { path = "../../instrumentation" }
quent-exporter = { path = "../../exporter", features = ["callback"] }
serde = { workspace = true }

[build-dependencies]
quent-constraints = { path = "../../constraints" }
quent-instrumentation-build = { path = ".." }
quent-schema = { path = "../../schema", features = ["test-utils"] }
