# Its own workspace, excluded from the repo workspace, so generated Parquet
# support is compiled without feature unification from other workspace crates.
[workspace]

[package]
name = "quent-instrumentation-build-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
narrow = { version = "0.15.1", features = ["arrow-rs", "derive", "uuid"] }
quent-instrumentation = { path = "../../instrumentation", features = ["io-parquet"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[build-dependencies]
quent-constraints = { path = "../../constraints" }
quent-instrumentation-build = { path = ".." }
quent-schema = { path = "../../schema", features = ["test-utils"] }
