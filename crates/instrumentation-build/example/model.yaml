# The event model, authored in YAML and compiled to instrumentation at build time.

quent: alpha
model: demo
doc: Instrumentation model of the demo connection server.

records:
  Endpoint:
    doc: A network endpoint.
    fields:
      host: string
      port: u16
  Meta:
    fields:
      tags: { list: string }
      extra: dynamic
  Route:
    doc: Details of one routing edge to an upstream server.
    fields:
      hops: u8

entities:
  Server:
    doc: A server that accepts connections.
    events:
      booted: once

  Connection:
    doc: A client connection.
    events:
      opened:
        doc: The connection was accepted.
        once:
          peer: Endpoint
          session: uuid
          # The hosting server. `scope-ref` makes Connection a child of Server
          # in the entity ref-tree (Server is the root).
          host: { scope-ref: Server }
      data:
        multi:
          bytes: u64
          meta: { option: Meta }
      routed:
        doc: Forwarded to an upstream server.
        once:
          # `ref` carrying `data`: the referenced server plus a record
          # describing this routing edge.
          upstream: { ref: Server, data: Route }
      closed: once
