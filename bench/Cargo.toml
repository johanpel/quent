[package]
name = "quent-bench"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["collector"]
# Route quent events through the in-process collector (gRPC) exporter.
collector = ["quent-instrumentation/io-collector", "quent-io/collector"]

[dependencies]
# quent side
bitcode.workspace = true
bincode.workspace = true
quent-dynamic-attributes = { path = "../crates/dynamic-attributes" }
quent-instrumentation = { path = "../crates/instrumentation", features = ["io-bitcode", "io-raw", "io-ndjson", "io-msgpack", "io-postcard"] }
quent-io = { path = "../crates/io", default-features = false, features = ["bitcode", "raw", "ndjson", "msgpack", "postcard"] }
quent-io-bitcode = { path = "../crates/io/bitcode" }
quent-io-raw = { path = "../crates/io/raw" }
quent-collector = { path = "../crates/collector/server" }
quent-collector-client = { path = "../crates/collector/client" }
quent-collector-proto = { path = "../crates/collector/proto" }

# tracing side (JSON structured logs/spans to a file, off-thread writer).
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
tracing-appender = "0.2"

# OpenTelemetry side (0.32 family; tonic 0.14 unifies with the workspace pin).
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["logs", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "logs", "trace"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "logs", "trace"] }

# infra
http.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream.workspace = true
tonic.workspace = true
uuid = { workspace = true, features = ["v7"] }

[build-dependencies]
quent-instrumentation-build = { path = "../crates/instrumentation-build" }
quent-yaml = { path = "../crates/yaml" }
quent-schema = { path = "../crates/schema" }
