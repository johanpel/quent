name: UI

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "crates/ui/**"
      - "domains/query_engine/ui/**"
      - "examples/simulator/ui/**"
      - "examples/simulator/server/build.rs"
      - "examples/simulator/server/Cargo.toml"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "ui/**"
      - "crates/ui/**"
      - "domains/query_engine/ui/**"
      - "examples/simulator/ui/**"
      - "examples/simulator/server/build.rs"
      - "examples/simulator/server/Cargo.toml"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

jobs:
  generate-bindings:
    name: Generate TS Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: pixi run cargo build -p quent-simulator-server --locked
      - run: pixi run pnpm --dir ui install --frozen-lockfile
      - run: pixi run pnpm --dir ui exec prettier --config .prettierrc --write '../examples/simulator/server/ts-bindings/**/*.ts'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts-bindings
          path: examples/simulator/server/ts-bindings/

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: true
      - run: pixi run pnpm --dir ui install --frozen-lockfile
      - run: pixi run pnpm --dir ui format:check

  lint:
    name: Lint
    needs: [generate-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts-bindings
          path: examples/simulator/server/ts-bindings
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: true
      - run: pixi run pnpm --dir ui install --frozen-lockfile
      - run: pixi run pnpm --dir ui routes:generate
      - run: pixi run pnpm --dir ui lint

  typecheck:
    name: Type Check
    needs: [generate-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts-bindings
          path: examples/simulator/server/ts-bindings
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: true
      - run: pixi run pnpm --dir ui install --frozen-lockfile
      - run: pixi run pnpm --dir ui typecheck

  test:
    name: Test
    needs: [generate-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts-bindings
          path: examples/simulator/server/ts-bindings
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: true
      - run: pixi run pnpm --dir ui install --frozen-lockfile
      - run: pixi run pnpm --dir ui routes:generate
      - run: pixi run pnpm --dir ui test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-test-results
          path: |
            ui/junit.xml
            ui/coverage/

  e2e:
    name: UI E2E
    needs: [generate-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts-bindings
          path: examples/simulator/server/ts-bindings
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: true
      - run: pixi run pnpm --dir ui install --frozen-lockfile
      - run: pixi run pnpm --dir ui exec playwright install --with-deps chromium
      - run: pixi run pnpm --dir ui test:e2e
        env:
          PLAYWRIGHT_CARGO_COMMAND: pixi run cargo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ui-e2e-failure-report
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: warn
          retention-days: 7

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: true
      - run: pixi run pnpm --dir ui install --frozen-lockfile
      - run: pixi run pnpm --dir ui audit --audit-level=high

  diff-bindings:
    name: TS Binding Diff
    if: github.event_name == 'pull_request'
    needs: [generate-bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: pixi run cargo build -p quent-simulator-server
      - run: pixi run pnpm --dir ui install --frozen-lockfile
      - run: pixi run pnpm --dir ui exec prettier --config .prettierrc --write '../examples/simulator/server/ts-bindings/**/*.ts'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts-bindings
          path: pr-bindings
      - name: Post binding diff to step summary
        run: |
          diff -rU3 examples/simulator/server/ts-bindings pr-bindings > ts-bindings.diff || true
          if [ -s ts-bindings.diff ]; then
            echo "## TS Binding Changes" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            cat ts-bindings.diff >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No TS binding changes." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "## TS Bindings (PR)" >> "$GITHUB_STEP_SUMMARY"
          for f in pr-bindings/*.ts; do
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '```typescript' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  build:
    name: Build
    needs: [generate-bindings, fmt, lint, typecheck, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts-bindings
          path: examples/simulator/server/ts-bindings
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: true
      - run: pixi run pnpm --dir ui install --frozen-lockfile
      - run: pixi run pnpm --dir ui build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 7
