name: Instrumentation Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "experimental/vibe/bench/**"
      - "crates/**"
      - "experimental/vibe/codegen/cpp/**"
      - "experimental/vibe/codegen/python/**"
      - ".github/workflows/benchmarks.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "experimental/vibe/bench/**"
      - "crates/**"
      - "experimental/vibe/codegen/cpp/**"
      - "experimental/vibe/codegen/python/**"
      - ".github/workflows/benchmarks.yml"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: true
          working-directory: experimental/vibe/bench
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-bench-cargo-${{ hashFiles('experimental/vibe/bench/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bench-cargo-
      - run: pixi run --manifest-path experimental/vibe/bench/pixi.toml --frozen smoke
